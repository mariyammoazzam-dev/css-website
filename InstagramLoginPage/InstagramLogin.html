<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="InstagramLogin.css">
</head>
<body>

    <div class="container">
        <div class="login-box">
            <h1 >Instagram</h1>

            <form>
                <input type="text"
                 placeholder="Phone number, username, or email"
                 onchange= "EmailCheckHandler(this.value)"
               />

                <input type="password" placeholder="Password"
                onchange ="verifyPasswordHandler(this.value)"/>

                
                <button type="submit">Log In</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <a href="#" class="facebook-login">Log in with Facebook</a>

            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <div class="signup-box">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>

</body>

<script src="Area.js"></script>

<script>
    let emailCheck = "mouzamali@gmail.com";
    const EmailCheckHandler = (email) => {
        console.log("Check", email);

        if (email === emailCheck){
            console.log("email matched");
            alert("IDENTICAL");
        }else{
            console.log("non-identical");
        }
    }


    let verifyPassword = 67890;

    const verifyPasswordHandler= (password) => {
        console.log("Verify", password);
        console.log("above given", verifyPassword)

        if(Number(password) === verifyPassword){
            console.log("password matched");
            alert("RIGHT");

        }else{
            console.log("wrong password");
        }
    }
    </script>



</html>
