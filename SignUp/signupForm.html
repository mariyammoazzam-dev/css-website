<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="signupForm.css">


</head>
<body>

    <div class="signup-box">
        <h2>Sign Up</h2>

        <form>
            <div class="input-group">
                <input type="text"
                 placeholder="Full Name" 
                onchange= "InputChangeHandler(this.value)"
                required >
            </div>

            <div class="input-group">
                <input type="email"
                placeholder="Email Address"
                onchange="EmailverifyHandler (this.value)" required>
            </div>

            <div class="input-group">
                <input type="password"
                 placeholder="Password"
                 onchange="PasswordCheckerHandler (this.value)" required>
            </div>

            <div class="input-group">
                <input type="password"
                 placeholder="Confirm Password"
                 onchange="ConfirmPasswordHandler (this.value)"required>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p>Already have an account? <a href="#">Login</a></p>
    </div>

</body>

    if(value === checktext){

     alert("VALUE MATCHED");

</script>
